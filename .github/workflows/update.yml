name: Update news and publish

on:
  schedule:
    # UTC → 北京时间每天 00:17 / 06:17 / 12:17 / 18:17
    - cron: '17 4,10,16,22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'org-news-public/**'
      - 'org-news/server.py'
      - 'scripts/update_feed.py'
      - 'scripts/translate_feed.py'
      - 'scripts/update_content.py'
      - 'scripts/extract_article.mjs'
      - 'scripts/package*.json'
      - 'scripts/offline_translate.py'
      - 'scripts/requirements-content.txt'
      - '.github/workflows/update.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: org-observer-publish
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORG_MODELS_DIR: ${{ github.workspace }}/.cache/translation-models
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json
      - name: Install article extraction dependencies
        run: npm ci --prefix scripts --no-audit --no-fund
      - name: Install offline translation runtime
        run: python -m pip install -r scripts/requirements-content.txt
      - uses: actions/cache@v4
        with:
          path: .cache/translation-models
          key: argos-models-1.9-en-zh-fr-v1
      - name: Prepare offline translation models
        run: python scripts/offline_translate.py
      - name: Fetch feeds, article bodies and translations
        run: python scripts/update_feed.py
      - name: Save feed history
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add org-news-public/feed.json org-news-public/bilingual.json org-news-public/content-index.json org-news-public/articles
          if ! git diff --cached --quiet; then
            git commit -m "$(cat <<'EOF'
          Update bilingual official RSS snapshot
          EOF
          )"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: org-news-public
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
